name: Proponer una mejora
description: Sugiere una mejora
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Algunas propuestas ya se han estudiado y descartado. Antes, consulta
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING_ES.md#cosas-que-estan-decididas),
        especialmente en lo relativo a lectores NFC por USB (imposibles físicamente
        en esta placa), el IDE de Arduino y la rotación motorizada de bobinas.

  - type: textarea
    id: problem
    attributes:
      label: ¿Qué problema resolvería?
      description: Describe la situación y no la solución técnica que tienes en mente.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: ¿Qué propones?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: ¿Qué parte del proyecto?
      options:
        - Interfaz de la pantalla táctil
        - Pesaje / calibración
        - Lectura NFC
        - Interfaz web
        - Sincronización con la nube
        - Actualizaciones OTA
        - Hardware / carcasa
        - Documentación
        - Herramientas de compilación
        - Otro
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: ¿Te gustaría colaborar?
      options:
        - label: Puedo preparar una solicitud de cambios
        - label: Tengo el hardware para probarlo
