name: Informar de un error
description: Algo no funciona
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Hay dos datos que importan más que el resto: **el entorno de compilación**
        y **cómo están cableados los lectores**.

        La mayoría de los casos en los que «no se detectan lectores» se deben a que
        el firmware se compiló para un tipo de conexión distinto al cableado. Esto
        no genera ningún mensaje de error, así que esos dos datos son imprescindibles.

  - type: dropdown
    id: env
    attributes:
      label: ¿Qué entorno de compilación instalaste?
      options:
        - esp32s3_hsu_b (default — ESP32-S3-Touch-LCD-3.5B)
        - esp32s3_hsu (ESP32-S3-Touch-LCD-3.5, sin B)
        - esp32s3 (cableado SPI)
        - esp32s3_i2c (cableado I2C)
        - esp32s3_hsu_debug
        - esp32s3_i2c_debug
        - No lo sé / instalé un binario publicado
    validations:
      required: true

  - type: dropdown
    id: wiring
    attributes:
      label: ¿Cómo están conectados físicamente los lectores PN532?
      options:
        - HSU / UART (module mode switch OFF/OFF)
        - SPI (module mode switch OFF/ON)
        - I2C (module mode switch ON/OFF)
        - No hay lectores conectados
        - No estoy seguro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión del firmware
      description: Aparece en la pantalla de inicio y en Ajustes, o en `TIGERSCALE_FW_VERSION` del §2.
      placeholder: "2.2.0"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: ¿Qué ha ocurrido?
      description: ¿Qué esperabas que ocurriera y qué ha ocurrido en su lugar?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Coloca una bobina en la plataforma
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Registro del puerto serie cuando ocurre el fallo
      description: |
        Usa `pio device monitor`, o `python3 scripts/watch_logs.py <device-ip>` si
        el cable está desconectado. El monitor decodifica automáticamente las trazas.

        Si el problema afecta a un lector, resulta mucho más útil un registro de
        `esp32s3_hsu_debug` o `esp32s3_i2c_debug`: muestra cada byte del enlace PN532.
      render: shell

  - type: textarea
    id: hardware
    attributes:
      label: Datos del hardware
      description: Variante de la placa, célula de carga y cualquier elemento no estándar.

  - type: checkboxes
    id: checked
    attributes:
      label: Antes de enviar
      options:
        - label: He leído [docs/TROUBLESHOOTING_ES.md](../blob/main/docs/TROUBLESHOOTING_ES.md)
        - label: El entorno de compilación coincide con el cableado (o he indicado que podría no coincidir)
